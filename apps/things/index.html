<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#edf3ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101a17" media="(prefers-color-scheme: dark)" />
    <!-- Paint the launch surface before the module stylesheet or React can load. -->
    <style>
      :root {
        color-scheme: light dark;
        background: #edf3ed;
      }

      html {
        width: 100%;
        margin: 0;
        background: #edf3ed;
      }

      body,
      #root {
        width: 100%;
        margin: 0;
        background: #edf3ed;
      }

      @media (prefers-color-scheme: dark) {
        :root,
        html,
        body,
        #root {
          background: #101a17;
        }
      }
    </style>
    <link rel="manifest" href="/things/manifest.webmanifest" />
    <link rel="icon" href="/things/icons/things-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/things/icons/things-apple-touch-icon.png" />
    <title>Things</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
